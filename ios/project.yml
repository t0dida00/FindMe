name: FindMe
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    exactVersion: 2.55.6
targets:
  FindMe:
    type: application
    platform: iOS
    sources:
      - path: FindMe
    dependencies:
      - package: Supabase
        product: Supabase
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    info:
      path: FindMe/Resources/Info.plist
      properties:
        CFBundleDisplayName: "Find Me!"
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, vi]
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationQueriesSchemes: []
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: Canvas
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: "Find Me! uses the camera so you can photograph the proof sheet inside the app. Photos are only sent to the host for review."
        NSLocationWhenInUseUsageDescription: "Your location is only shown on the map on this device and is never sent to the server."
        NSPhotoLibraryUsageDescription: "Hosts pick photos from the library for clue blocks (players never use the photo library)."
        CFBundleURLTypes:
          - CFBundleURLName: com.findme.app.deeplink
            CFBundleURLSchemes: [findme]
        SUPABASE_URL: "$(SUPABASE_URL)"
        SUPABASE_ANON_KEY: "$(SUPABASE_ANON_KEY)"
        FINDME_FREE_TEAM: "$(FREE_TEAM)"
    settings:
      base:
        PRODUCT_NAME: FindMe
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
